name: Release APK

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. This APK is signed with a throw-away debug key (a new one on every run), so it cannot update an installed copy of the app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare Release Artifacts & Tag
        id: release_info
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || true)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          TAG_NAME="v${VERSION_NAME}.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          # Rename the APK to a versioned, human-friendly name
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="app/build/outputs/apk/release/gallery-${TAG_NAME}.apk"
          mv "$APK_SRC" "$APK_DEST"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ steps.release_info.outputs.tag_name }}
          path: app/build/outputs/apk/release/gallery-${{ steps.release_info.outputs.tag_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          # The tag goes on the commit that was built, not on whatever the default branch is at now.
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.release_info.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          # A build signed with a throw-away debug key is marked as a pre-release.
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          files: |
            app/build/outputs/apk/release/gallery-${{ steps.release_info.outputs.tag_name }}.apk
